<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc">
<title id="title">03  当前模式：Engine 发起，窗口内串行</title><desc id="desc">到达顺序决定何时开窗；发送时间与序号决定窗口内的处理顺序。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#2563a6"/></marker><marker id="reply" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#167568"/></marker></defs>
<rect width="1000" height="900" rx="14" fill="#fff"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="30" y="40" font-size="26" fill="#24374b" text-anchor="start" font-weight="700">03  当前模式：Engine 发起，窗口内串行</text>
<text x="30" y="74" font-size="18" fill="#65788c" text-anchor="start" font-weight="400">到达顺序决定何时开窗；发送时间与序号决定窗口内的处理顺序。</text>
<rect x="40" y="96" width="220" height="46" rx="6" fill="#eaf1f8" stroke="#bdccdc"/>
<text x="150" y="126" font-size="21" fill="#24374b" text-anchor="middle" font-weight="600">Engine A</text>
<path d="M150 142 V845" stroke="#a9b8c8" stroke-dasharray="6 6"/>
<rect x="390" y="96" width="220" height="46" rx="6" fill="#eaf1f8" stroke="#bdccdc"/>
<text x="500" y="126" font-size="21" fill="#24374b" text-anchor="middle" font-weight="600">Proxy</text>
<path d="M500 142 V845" stroke="#a9b8c8" stroke-dasharray="6 6"/>
<rect x="740" y="96" width="220" height="46" rx="6" fill="#eaf1f8" stroke="#bdccdc"/>
<text x="850" y="126" font-size="21" fill="#24374b" text-anchor="middle" font-weight="600">Engine B</text>
<path d="M850 142 V845" stroke="#a9b8c8" stroke-dasharray="6 6"/>
<rect x="482" y="183" width="36" height="256" rx="6" fill="#e8effa" stroke="#a7bddb"/>
<path d="M850 218 H518" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="684.0" y="208" font-size="19" fill="#2563a6" text-anchor="middle" stroke="white" stroke-width="5" paint-order="stroke">请求 B：snapshot，sent_at=102</text>
<text x="540" y="254" font-size="18" fill="#65788c" text-anchor="start" font-weight="400">本地 0ms：第一条请求开窗</text>
<path d="M150 304 H482" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="316.0" y="294" font-size="19" fill="#2563a6" text-anchor="middle" stroke="white" stroke-width="5" paint-order="stroke">请求 A：snapshot，sent_at=100</text>
<text x="540" y="340" font-size="18" fill="#65788c" text-anchor="start" font-weight="400">本地 3ms：加入同一窗口</text>
<rect x="80" y="356" width="345" height="74" rx="6" fill="#f0f4f8" stroke="#d5dfe9"/>
<text x="252.5" y="384" font-size="19" fill="#24374b" text-anchor="middle" font-weight="400">固定 5ms 窗口</text>
<text x="252.5" y="412" font-size="19" fill="#24374b" text-anchor="middle" font-weight="400">后续到达不延长截止时间</text>
<rect x="30" y="449" width="940" height="36" rx="6" fill="#edf2f7" stroke="none"/>
<text x="45" y="474" font-size="19" fill="#24374b" text-anchor="start" font-weight="600">本地 5ms：取出已到请求，按 (sent_at, engine_id, request_seq) 排序 → A、B</text>
<rect x="491" y="507" width="18" height="139" rx="2" fill="#d5eee5" stroke="#8fbfaf"/>
<rect x="540" y="505" width="390" height="74" rx="6" fill="#eaf6f2" stroke="#c4ddd5"/>
<text x="735.0" y="533" font-size="19" fill="#24374b" text-anchor="middle" font-weight="400">① 写入 A 的 snapshot</text>
<text x="735.0" y="561" font-size="19" fill="#24374b" text-anchor="middle" font-weight="400">处理 A，生成回复</text>
<path d="M491 622 H150" fill="none" stroke="#167568" stroke-width="2" marker-end="url(#reply)" stroke-dasharray="7 5"/>
<text x="320.5" y="612" font-size="19" fill="#167568" text-anchor="middle" stroke="white" stroke-width="5" paint-order="stroke">回复 A</text>
<rect x="491" y="662" width="18" height="139" rx="2" fill="#d5eee5" stroke="#8fbfaf"/>
<rect x="70" y="660" width="390" height="102" rx="6" fill="#eaf6f2" stroke="#c4ddd5"/>
<text x="265.0" y="688" font-size="19" fill="#24374b" text-anchor="middle" font-weight="400">② 写入 B 的 snapshot</text>
<text x="265.0" y="716" font-size="19" fill="#24374b" text-anchor="middle" font-weight="400">共享视图已包含 A 的更新</text>
<text x="265.0" y="744" font-size="19" fill="#24374b" text-anchor="middle" font-weight="400">处理 B，生成回复</text>
<path d="M509 783 H850" fill="none" stroke="#167568" stroke-width="2" marker-end="url(#reply)" stroke-dasharray="7 5"/>
<text x="679.5" y="773" font-size="19" fill="#167568" text-anchor="middle" stroke="white" stroke-width="5" paint-order="stroke">回复 B</text>
<text x="500" y="841" font-size="20" fill="#24374b" text-anchor="middle" font-weight="600">单一处理器：处理 A / 回复 A 完成后，才开始处理 B</text>
<text x="30" y="880" font-size="17" fill="#65788c" text-anchor="start" font-weight="400">每个 Engine 等待自己的回复；原 update / ownership dispatch 继续负责结果同步与请求分发。</text>
</g></svg>