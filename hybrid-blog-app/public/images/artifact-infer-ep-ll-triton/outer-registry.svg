<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 410" role="img" aria-labelledby="title">
<title id="title">Outer registry cell bindings in combine()</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#172554;font-size:16px} .label{font-family:monospace;font-size:14px} .heading{font-size:22px;font-weight:bold}</style>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="30" y="40" class="heading" text-anchor="start">Outer registry — combine()</text>
<rect x="30" y="95" width="220" height="65" rx="10" fill="#eff6ff" stroke="#93a9c6"/>
<text x="140.0" y="121.5" class="" text-anchor="middle">block_manager</text>
<text x="140.0" y="143.5" class="" text-anchor="middle">[BlockManager]</text>
<rect x="30" y="255" width="220" height="65" rx="10" fill="#eff6ff" stroke="#93a9c6"/>
<text x="140.0" y="281.5" class="" text-anchor="middle">model_runner</text>
<text x="140.0" y="303.5" class="" text-anchor="middle">[ModelRunner]</text>
<rect x="535" y="95" width="195" height="65" rx="10" fill="#eff6ff" stroke="#93a9c6"/>
<text x="632.5" y="121.5" class="" text-anchor="middle">scheduler</text>
<text x="632.5" y="143.5" class="" text-anchor="middle">[Scheduler]</text>
<rect x="820" y="255" width="200" height="65" rx="10" fill="#eff6ff" stroke="#93a9c6"/>
<text x="920.0" y="281.5" class="" text-anchor="middle">engine</text>
<text x="920.0" y="303.5" class="" text-anchor="middle">[LLMEngine]</text>
<path d="M250 130 H535" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="270" y="83" class="label" text-anchor="start">allocate, can_allocate,</text>
<text x="270" y="105" class="label" text-anchor="start">can_append, deallocate,</text>
<text x="270" y="127" class="label" text-anchor="start">may_append</text>
<path d="M730 130 H920 V255" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="760" y="83" class="label" text-anchor="start">add, is_finished,</text>
<text x="760" y="105" class="label" text-anchor="start">postprocess, schedule</text>
<path d="M250 290 H820" fill="none" stroke="#2563eb" stroke-width="2"  marker-end="url(#arrow)"/>
<text x="500" y="277" class="label" text-anchor="start">run</text>
<text x="30" y="375" class="" text-anchor="start">Blue arrows: provider → consumer; labels are registered cell names.</text>
</svg>